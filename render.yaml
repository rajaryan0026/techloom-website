# Deploy backend + Postgres on Render: https://render.com
# Dashboard → New → Blueprint → connect this repo

databases:
  - name: techloom-db
    plan: free
    databaseName: techloom
    user: techloom

services:
  - type: web
    name: techloom-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build
    startCommand: npx prisma db push && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: techloom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: FRONTEND_URL
        value: https://www.techloom.live
      - key: CORS_ORIGIN
        value: https://www.techloom.live,https://techloom.live
      - key: API_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Techloom <onboarding@resend.dev>
      - key: CONTACT_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@techloom.com
      - key: ADMIN_PASSWORD
        sync: false